<!DOCTYPE html>
<html>
<body style="background:#121212; color:white; font-family:sans-serif; text-align:center; padding-top:50px;">
    <h2>📝 Manager Registration</h2>
    <form method="post" style="display:inline-block; text-align:left; background:#1f1f1f; padding:30px; border-radius:8px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width:100%; padding:10px; background:#00d2ff; border:none; cursor:pointer;">Register</button>
    </form>
</body>
</html>
