<!DOCTYPE html>
<html>
<body style="background:#121212; color:white; font-family:sans-serif; text-align:center; padding-top:50px;">
    <h2>🔐 QC-Vision Pro Login</h2>
    <form method="post" style="display:inline-block; text-align:left; background:#1f1f1f; padding:30px; border-radius:8px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width:100%; padding:10px; background:#00d2ff; border:none; cursor:pointer;">Login</button>
    </form>
    <p>New Manager? <a href="{% url 'register' %}" style="color:#00d2ff;">Register Here</a></p>
</body>
</html>
