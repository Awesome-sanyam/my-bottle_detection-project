<video id="webcam" autoplay playsinline width="400" height="400"></video>
<canvas id="canvas" style="display:none;"></canvas>
<div id="result">Waiting for result...</div>

<script>
    const video = document.getElementById('webcam');
    // Access the camera
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; });

    // Function to capture and send frame to Django
    function captureFrame() {
        const canvas = document.getElementById('canvas');
        canvas.getContext('2d').drawImage(video, 0, 0, 400, 400);
        const dataURL = canvas.toDataURL('image/jpeg');
        
        // Use Fetch API to send dataURL to your Django view
        // fetch('/detect/', { method: 'POST', body: JSON.stringify({image: dataURL}) })
    }
</script>
